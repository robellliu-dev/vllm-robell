name: CPU Build

on:
  pull_request:
    paths:
      - '.github/workflows/cpu-build.yml'
      - 'requirements/**'
      - 'setup.py'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'vllm/**'
      - 'csrc/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cpu-build.yml'
      - 'requirements/**'
      - 'setup.py'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'vllm/**'
      - 'csrc/**'
  workflow_dispatch:

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install CPU build dependencies
        run: |
          uv pip install --system -r requirements/cpu-build.txt --index-strategy unsafe-best-match
          uv pip install --system -r requirements/cpu.txt --index-strategy unsafe-best-match

      - name: Build and install vLLM (CPU)
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
          VLLM_TARGET_DEVICE: cpu
        run: |
          uv pip install --system -e . --no-build-isolation

      - name: Smoke test import
        run: python -c "import vllm; print(vllm.__version__)"
